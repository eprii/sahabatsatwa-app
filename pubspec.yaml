name: sahabatsatwa_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^4.0.0
  firebase_core: ^2.0.0
  url_launcher: ^6.2.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/sahabatsatwa_logo_native_splash.png
  android_gravity: center
  android: true
  ios: true
  web: false
  android_12:
    image: assets/icon/sahabatsatwa_logo_native_splash.png
    color: "#ffffff"
    icon_background_color: "#ffffff"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/sahabatsatwa_logo.png
    - assets/icon/sahabatsatwa_logo_native_splash.png
